name: PR Code Review Checks

on:
  pull_request:
    branches:
      - main

jobs:

  quality-checks:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run:

        npm ci

    - name: Run lint
      run:

        npm run lint

    - name: Run tests
      run:

        npm test

    - name: Build application
      run:

        npm run build