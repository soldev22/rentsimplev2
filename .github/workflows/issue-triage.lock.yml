name: AI Issue Triage
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Classify issue with GitHub Copilot
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const prompt = `
            Classify this GitHub issue as one of: bug, feature, question, chore.
            Return ONLY the label name.

            Title: ${issue.title}
            Body: ${issue.body}
            `;
            const response = await github.rest.copilot.generate({
              owner: context.repo.owner,
              repo: context.repo.repo,
              prompt
            });
            return response.data.text.trim();

      - name: Add label
        uses: actions/github-script@v7
        with:
          script: |
            const label = "${{ steps.classify.outputs.result }}";
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label]
            });

      - name: Comment summary
        uses: actions/github-script@v7
        with:
          script: |
            const label = "${{ steps.classify.outputs.result }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `AI triage classified this issue as **${label}**.`
            });
